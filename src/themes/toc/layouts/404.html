{{ define "main" }}
<article class="content content--single">
  <header class="page-title">
    <p class="eyebrow">404</p>
    <h1>{{ .Site.Params.pageNotFoundTitle | default "Not Found" }}</h1>
  </header>
  <p>{{ .Site.Params.pageNotFoundDetail | default "The page you requested cannot be found." }}</p>
  <p><a class="button button--secondary" href="{{ .Site.Home.RelPermalink }}">Return home</a></p>
</article>
{{ end }}
